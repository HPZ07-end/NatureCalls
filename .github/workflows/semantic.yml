name: Semantic contract
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  semantic-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Validate PR semantic record
        run: python scripts/semantic.py check --event "$GITHUB_EVENT_PATH"
